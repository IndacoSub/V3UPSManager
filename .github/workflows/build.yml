name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore V3UPSManager.sln -p:EnableWindowsTargeting=true
      - name: Build
        run: dotnet build V3UPSManager.sln --no-restore -c Release -p:EnableWindowsTargeting=true
      - name: Test Core
        run: dotnet test V3UPSManager.Core.Tests/V3UPSManager.Core.Tests.csproj --no-build -c Release --logger "trx;LogFileName=core.trx"
      - name: Report test failures
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter core.trx | ForEach-Object {
            [xml]$report = Get-Content -LiteralPath $_.FullName -Raw
            $report.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'Failed' | ForEach-Object {
              $title = ([string]$_.testName).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A').Replace(',', '%2C').Replace(':', '%3A')
              $message = ([string]$_.Output.ErrorInfo.Message).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=${title}::$message"
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
